<div class="min-vh-100 d-flex align-items-center justify-content-center py-5" style="background-color:#F4FAF8;">
    <div class="animate__animated animate__fadeIn" style="width:100%;max-width:460px;padding:0 1rem;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-briefcase fa-2x mb-2" style="color:#0F6E56;"></i>
            <h1 class="h4 fw-medium mb-1">Bienvenido de nuevo</h1>
            <p class="text-secondary small">Selecciona tu tipo de cuenta para acceder</p>
        </div>

        <!-- Acceso rápido prueba -->
        <div class="row g-3 mb-4">
            <div class="col-4">
                <a routerLink="/cliente/dashboard" class="card border-0 shadow-sm text-center p-3 text-decoration-none d-block">
                    <i class="fa-solid fa-building fa-2x mb-2" style="color:#085041;"></i>
                    <p class="fw-medium mb-1 small" style="color:#085041;">Soy Cliente</p>
                    <small class="text-secondary" style="font-size:.72rem;">Gestiona proyectos</small>
                </a>
            </div>
            <div class="col-4">
                <a routerLink="/freelancer/dashboard" class="card border-0 shadow-sm text-center p-3 text-decoration-none d-block">
                    <i class="fa-solid fa-user-tie fa-2x mb-2" style="color:#0C447C;"></i>
                    <p class="fw-medium mb-1 small" style="color:#0C447C;">Soy Freelancer</p>
                    <small class="text-secondary" style="font-size:.72rem;">Encuentra trabajo</small>
                </a>
            </div>
            <div class="col-4">
                <a routerLink="/admin/dashboard" class="card border-0 shadow-sm text-center p-3 text-decoration-none d-block">
                    <i class="fa-solid fa-shield-halved fa-2x mb-2" style="color:#534AB7;"></i>
                    <p class="fw-medium mb-1 small" style="color:#534AB7;">Administrador</p>
                    <small class="text-secondary" style="font-size:.72rem;">Panel de control</small>
                </a>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2 mb-3">
            <hr class="flex-grow-1 m-0"><span class="text-secondary small">o ingresa con tu correo</span>
            <hr class="flex-grow-1 m-0">
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div class="mb-3">
                    <label class="form-label small">Correo electrónico</label>
                    <input type="email" class="form-control" placeholder="usuario@correo.com">
                </div>
                <div class="mb-3">
                    <label class="form-label small">Contraseña</label>
                    <input type="password" class="form-control" placeholder="••••••••">
                </div>
                <div class="d-flex gap-2">
                    <a routerLink="/cliente/dashboard" class="btn flex-grow-1 btn-sm" style="background-color:#0F6E56;color:#E1F5EE;">Entrar como Cliente</a>
                    <a routerLink="/freelancer/dashboard" class="btn flex-grow-1 btn-sm" style="background-color:#185FA5;color:#E6F1FB;">Entrar como Freelancer</a>
                    <a routerLink="/admin/dashboard" class="btn flex-grow-1 btn-sm" style="background-color:#534AB7;color:#EEEDFE;">Entrar como Admin</a>
                </div>
            </div>
        </div>
        <p class="text-center small mt-3 mb-0">¿No tienes cuenta? <a routerLink="/registro" style="color:#0F6E56;">Regístrate</a></p>
    </div>
</div>
