<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background-color:#F4FAF8;">
  <div class="card shadow-sm border-0 animate__animated animate__fadeIn" style="max-width:380px;width:100%;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="fa-solid fa-briefcase fa-2x mb-2" style="color:#0F6E56;"></i>
        <h1 class="h5 fw-medium mb-0">Bienvenido de nuevo</h1>
        <p class="text-secondary small">Ingresa a tu cuenta de TaskConnect</p>
      </div>
      <form>
        <div class="mb-3">
          <label class="form-label small">Correo electrónico</label>
          <input type="email" class="form-control" placeholder="usuario@correo.com">
        </div>
        <div class="mb-3">
          <label class="form-label small">Contraseña</label>
          <input type="password" class="form-control" placeholder="••••••••">
        </div>
        <button type="submit" class="btn w-100" style="background-color:#0F6E56;color:#E1F5EE;">Iniciar sesión</button>
      </form>
      <hr>
      <p class="text-center small mb-0">¿No tienes cuenta? <a routerLink="/registro" style="color:#0F6E56;">Regístrate</a></p>
    </div>
  </div>
</div>
