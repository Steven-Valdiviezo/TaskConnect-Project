<div class="min-vh-100 d-flex align-items-center justify-content-center py-5" style="background-color:#F4FAF8;">
  <div class="card shadow-sm border-0 animate__animated animate__fadeIn" style="max-width:480px;width:100%;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="fa-solid fa-briefcase fa-2x mb-2" style="color:#0F6E56;"></i>
        <h1 class="h5 fw-medium mb-0">Crea tu cuenta</h1>
        <p class="text-secondary small">Únete a TaskConnect en segundos</p>
      </div>

      <p class="small fw-medium mb-2">¿Cómo vas a usar la plataforma?</p>
      <div class="row g-2 mb-3">
        <div class="col-6">
          <input type="radio" class="btn-check" name="rol" id="rolCliente" checked>
          <label class="btn btn-outline-secondary w-100 text-start p-3" for="rolCliente" style="border-color:#5DCAA5;">
            <i class="fa-solid fa-building d-block mb-1" style="color:#0F6E56;"></i>
            <span class="small fw-medium">Soy cliente</span>
          </label>
        </div>
        <div class="col-6">
          <input type="radio" class="btn-check" name="rol" id="rolFreelancer">
          <label class="btn btn-outline-secondary w-100 text-start p-3" for="rolFreelancer">
            <i class="fa-solid fa-user d-block mb-1" style="color:#185FA5;"></i>
            <span class="small fw-medium">Soy freelancer</span>
          </label>
        </div>
      </div>

      <form>
        <div class="mb-3">
          <label class="form-label small">Nombre completo</label>
          <input type="text" class="form-control" placeholder="Tu nombre completo">
        </div>
        <div class="mb-3">
          <label class="form-label small">Correo electrónico</label>
          <input type="email" class="form-control" placeholder="usuario@correo.com">
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label small">Contraseña</label>
            <input type="password" class="form-control" placeholder="••••••••">
          </div>
          <div class="col-6 mb-3">
            <label class="form-label small">Confirmar</label>
            <input type="password" class="form-control" placeholder="••••••••">
          </div>
        </div>
        <button type="submit" class="btn w-100" style="background-color:#0F6E56;color:#E1F5EE;">Crear cuenta</button>
      </form>
      <hr>
      <p class="text-center small mb-0">¿Ya tienes cuenta? <a routerLink="/login" style="color:#0F6E56;">Inicia sesión</a></p>
    </div>
  </div>
</div>
