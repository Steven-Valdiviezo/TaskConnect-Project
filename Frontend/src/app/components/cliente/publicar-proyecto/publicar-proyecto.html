<div class="d-flex flex-column min-vh-100">
  <nav class="navbar px-3" style="background-color:#04342C;height:56px;" data-bs-theme="dark">
    <span class="navbar-brand mb-0" style="color:#9FE1CB;"><i class="fa-solid fa-briefcase me-2" style="color:#5DCAA5;"></i>TaskConnect</span>
    <span class="ms-auto badge rounded-pill" style="background-color:#E1F5EE;color:#085041;">Cliente</span>
  </nav>

  <div class="d-flex flex-grow-1">
    <aside class="p-3" style="width:200px;background-color:#F1EFE8;border-right:1px solid #dee2e6;">
      <a routerLink="/cliente/dashboard" class="d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none text-secondary">
        <i class="fa-solid fa-table-columns"></i> Dashboard
      </a>
      <a class="d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none fw-medium" style="color:#085041;background-color:#fff;">
        <i class="fa-solid fa-folder"></i> Mis proyectos
      </a>
      <a class="d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none text-secondary">
        <i class="fa-solid fa-users"></i> Propuestas
      </a>
      <a class="d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none text-secondary">
        <i class="fa-solid fa-file-contract"></i> Contratos
      </a>
      <a class="d-flex align-items-center gap-2 p-2 rounded text-decoration-none text-secondary">
        <i class="fa-solid fa-user"></i> Mi perfil
      </a>
    </aside>

    <main class="flex-grow-1 p-4">
      <div class="d-flex align-items-center gap-2 mb-3">
        <a routerLink="/cliente/dashboard" class="text-secondary"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="h5 fw-medium mb-0">Publicar nuevo proyecto</h1>
      </div>

      <form class="row g-3 animate__animated animate__fadeIn" style="max-width:760px;">
        <div class="col-md-6">
          <label class="form-label small">Título del proyecto *</label>
          <input type="text" class="form-control" placeholder="Ej. Diseño de logo corporativo">
        </div>
        <div class="col-md-6">
          <label class="form-label small">Categoría *</label>
          <select class="form-select">
            <option selected disabled>Seleccionar...</option>
            <option>Desarrollo web</option>
            <option>Diseño gráfico</option>
            <option>Marketing digital</option>
            <option>Desarrollo móvil</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small">Presupuesto (USD) *</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" class="form-control" placeholder="0.00">
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label small">Fecha de entrega estimada *</label>
          <input type="date" class="form-control">
        </div>
        <div class="col-12">
          <label class="form-label small">Descripción del proyecto *</label>
          <textarea class="form-control" rows="4" placeholder="Describe los requisitos, entregables y plazos..."></textarea>
        </div>
        <div class="col-12 d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary">Cancelar</button>
          <button type="submit" class="btn" style="background-color:#0F6E56;color:#E1F5EE;">Publicar proyecto</button>
        </div>
      </form>
    </main>
  </div>
</div>
