<div>
    <div class="d-flex align-items-center gap-2 mb-4">
        <a routerLink="/cliente/mis-proyectos" style="color:#6e9e85;"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="h5 fw-medium mb-0" style="color:#cce8d8;">Publicar nuevo proyecto</h1>
    </div>

    <form class="row g-3 animate__animated animate__fadeIn" style="max-width:760px;">
        <div class="col-md-6">
            <label class="form-label small" style="color:#6e9e85;">Título del proyecto *</label>
            <input type="text" class="form-control" style="background-color:#142b21;border-color:#1c3c2d;color:#cce8d8;" placeholder="Ej. Diseño de logo corporativo">
        </div>
        <div class="col-md-6">
            <label class="form-label small" style="color:#6e9e85;">Categoría *</label>
            <select class="form-select" style="background-color:#142b21;border-color:#1c3c2d;color:#cce8d8;">
        <option selected disabled>Seleccionar...</option>
        <option>Desarrollo web</option>
        <option>Diseño gráfico</option>
        <option>Marketing digital</option>
        <option>Desarrollo móvil</option>
      </select>
        </div>
        <div class="col-md-6">
            <label class="form-label small" style="color:#6e9e85;">Presupuesto (USD) *</label>
            <div class="input-group">
                <span class="input-group-text" style="background-color:#1c3c2d;border-color:#1c3c2d;color:#6e9e85;">$</span>
                <input type="number" class="form-control" style="background-color:#142b21;border-color:#1c3c2d;color:#cce8d8;" placeholder="0.00">
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label small" style="color:#6e9e85;">Fecha de entrega *</label>
            <input type="date" class="form-control" style="background-color:#142b21;border-color:#1c3c2d;color:#cce8d8;">
        </div>
        <div class="col-12">
            <label class="form-label small" style="color:#6e9e85;">Descripción *</label>
            <textarea class="form-control" rows="4" style="background-color:#142b21;border-color:#1c3c2d;color:#cce8d8;" placeholder="Describe los requisitos, entregables y plazos..."></textarea>
        </div>
        <div class="col-12 d-flex justify-content-end gap-2">
            <a routerLink="/cliente/dashboard" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn" style="background-color:#5DCAA5;color:#04342C;">Publicar proyecto</button>
        </div>
    </form>
</div>
