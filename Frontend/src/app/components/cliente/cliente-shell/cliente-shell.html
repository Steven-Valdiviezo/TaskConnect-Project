<div class="d-flex flex-column min-vh-100" style="background-color:#0d1a14;">
    <!-- Topnav -->
    <nav class="navbar px-3 flex-shrink-0" style="background-color:#04342C;height:56px;" data-bs-theme="dark">
        <span class="navbar-brand mb-0" style="color:#9FE1CB;">
      <i class="fa-solid fa-briefcase me-2" style="color:#5DCAA5;"></i>TaskConnect
    </span>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="badge rounded-pill" style="background-color:#E1F5EE;color:#085041;">Cliente</span>
            <i class="fa-solid fa-bell text-white" style="cursor:pointer;"></i>
            <div class="rounded-circle d-flex align-items-center justify-content-center small fw-medium" style="width:32px;height:32px;background-color:#E1F5EE;color:#085041;">JC</div>
            <a routerLink="/login" class="btn btn-sm btn-outline-light ms-2" style="font-size:.75rem;">Salir</a>
        </div>
    </nav>

    <div class="d-flex flex-grow-1">
        <!-- Sidebar -->
        <aside class="p-3 flex-shrink-0" style="width:210px;background-color:#091410;border-right:1px solid #1c3c2d;">
            <a routerLink="/cliente/dashboard" routerLinkActive="side-active" [routerLinkActiveOptions]="{exact:true}" class="side-link d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-table-columns"></i> Dashboard
            </a>
            <a routerLink="/cliente/mis-proyectos" routerLinkActive="side-active" class="side-link d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-folder"></i> Mis proyectos
            </a>
            <a routerLink="/cliente/publicar-proyecto" routerLinkActive="side-active" class="side-link d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-plus-circle"></i> Publicar proyecto
            </a>
            <a routerLink="/cliente/propuestas" routerLinkActive="side-active" class="side-link d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-users"></i> Propuestas
            </a>
            <a routerLink="/cliente/contratos" routerLinkActive="side-active" class="side-link d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-file-contract"></i> Contratos
            </a>
            <hr style="border-color:#1c3c2d;margin:.5rem 0;">
            <a routerLink="/cliente/mensajes" routerLinkActive="side-active" class="side-link d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-message"></i> Mensajes
            </a>
            <a routerLink="/cliente/pagos" routerLinkActive="side-active" class="side-link d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-credit-card"></i> Pagos
            </a>
            <a routerLink="/cliente/calificaciones" routerLinkActive="side-active" class="side-link d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-star"></i> Calificaciones
            </a>
            <hr style="border-color:#1c3c2d;margin:.5rem 0;">
            <a routerLink="/cliente/perfil" routerLinkActive="side-active" class="side-link d-flex align-items-center gap-2 p-2 rounded text-decoration-none">
                <i class="fa-solid fa-user"></i> Mi perfil
            </a>
        </aside>

        <!-- Contenido hijo -->
        <main class="flex-grow-1 p-4" style="background-color:#0d1a14;color:#cce8d8;overflow-y:auto;">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>

<style>
    .side-link {
        color: #6e9e85;
        font-size: .875rem;
        transition: .15s;
    }
    
    .side-link:hover {
        color: #cce8d8;
        background-color: #0f2619 !important;
    }
    
    .side-active {
        color: #5DCAA5 !important;
        background-color: #0f2619 !important;
        font-weight: 600;
        border-left: 3px solid #5DCAA5;
    }
</style>
