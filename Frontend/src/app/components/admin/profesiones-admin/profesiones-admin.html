<h1 class="h5 fw-medium mb-4" style="color:#d8d5f5;">Gestión de profesiones</h1>
<div class="row g-4">
    <div class="col-md-7">
        <h2 class="h6 fw-medium mb-2" style="color:#d8d5f5;">Profesiones registradas</h2>
        <div class="table-responsive">
            <table class="table align-middle" style="--bs-table-bg:transparent;--bs-table-color:#d8d5f5;">
                <thead>
                    <tr style="border-color:#2a2550;">
                        <th class="small" style="color:#8e89c4;border-color:#2a2550;">Nombre</th>
                        <th class="small" style="color:#8e89c4;border-color:#2a2550;">Freelancers</th>
                        <th class="small" style="color:#8e89c4;border-color:#2a2550;">Acciones</th>
                    </tr>
                </thead>
                <tbody class="small">
                    <tr style="border-color:#2a2550;">
                        <td style="color:#d8d5f5;">Desarrollador web</td>
                        <td style="color:#8e89c4;">42</td>
                        <td>
                            <div class="d-flex gap-1">
                                <button class="btn btn-sm" style="background-color:#1e1a35;color:#8e89c4;font-size:.75rem;padding:2px 7px;"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-sm" style="background-color:#2a1a1a;color:#e88080;font-size:.75rem;padding:2px 7px;"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                    <tr style="border-color:#2a2550;">
                        <td style="color:#d8d5f5;">Diseñador UX/UI</td>
                        <td style="color:#8e89c4;">28</td>
                        <td>
                            <div class="d-flex gap-1">
                                <button class="btn btn-sm" style="background-color:#1e1a35;color:#8e89c4;font-size:.75rem;padding:2px 7px;"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-sm" style="background-color:#2a1a1a;color:#e88080;font-size:.75rem;padding:2px 7px;"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                    <tr style="border-color:#2a2550;">
                        <td style="color:#d8d5f5;">Community Manager</td>
                        <td style="color:#8e89c4;">19</td>
                        <td>
                            <div class="d-flex gap-1">
                                <button class="btn btn-sm" style="background-color:#1e1a35;color:#8e89c4;font-size:.75rem;padding:2px 7px;"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-sm" style="background-color:#2a1a1a;color:#e88080;font-size:.75rem;padding:2px 7px;"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                    <tr style="border-color:#2a2550;">
                        <td style="color:#d8d5f5;">Desarrollador móvil</td>
                        <td style="color:#8e89c4;">15</td>
                        <td>
                            <div class="d-flex gap-1">
                                <button class="btn btn-sm" style="background-color:#1e1a35;color:#8e89c4;font-size:.75rem;padding:2px 7px;"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-sm" style="background-color:#2a1a1a;color:#e88080;font-size:.75rem;padding:2px 7px;"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="col-md-5">
        <h2 class="h6 fw-medium mb-3" style="color:#d8d5f5;">Nueva profesión</h2>
        <div class="p-3 rounded-3" style="background-color:#1e1a35;border:1px solid #2a2550;">
            <form>
                <div class="mb-3">
                    <label class="form-label small" style="color:#8e89c4;">Nombre *</label>
                    <input type="text" class="form-control" style="background-color:#12102a;border-color:#2a2550;color:#d8d5f5;" placeholder="Ej. Analista de datos">
                </div>
                <div class="mb-3">
                    <label class="form-label small" style="color:#8e89c4;">Descripción</label>
                    <textarea class="form-control" rows="2" style="background-color:#12102a;border-color:#2a2550;color:#d8d5f5;" placeholder="Breve descripción del rol..."></textarea>
                </div>
                <div class="d-flex gap-2 justify-content-end">
                    <button type="button" class="btn btn-sm" style="background-color:#12102a;color:#8e89c4;border:1px solid #2a2550;">Cancelar</button>
                    <button type="submit" class="btn btn-sm" style="background-color:#534AB7;color:#EEEDFE;">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
