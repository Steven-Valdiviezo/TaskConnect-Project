<div class="d-flex flex-column min-vh-100" style="background-color:#0d1420;">
    <nav class="navbar px-3 flex-shrink-0" style="background-color:#04342C;height:56px;" data-bs-theme="dark">
        <span class="navbar-brand mb-0" style="color:#9FE1CB;">
      <i class="fa-solid fa-briefcase me-2" style="color:#5DCAA5;"></i>TaskConnect
    </span>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="badge rounded-pill" style="background-color:#E6F1FB;color:#0C447C;">Freelancer</span>
            <i class="fa-solid fa-bell text-white" style="cursor:pointer;"></i>
            <div class="rounded-circle d-flex align-items-center justify-content-center small fw-medium" style="width:32px;height:32px;background-color:#E6F1FB;color:#0C447C;">MA</div>
            <a routerLink="/login" class="btn btn-sm btn-outline-light ms-2" style="font-size:.75rem;">Salir</a>
        </div>
    </nav>

    <div class="d-flex flex-grow-1">
        <aside class="p-3 flex-shrink-0" style="width:210px;background-color:#09121e;border-right:1px solid #1c2d3c;">
            <a routerLink="/freelancer/dashboard" routerLinkActive="side-active-f" [routerLinkActiveOptions]="{exact:true}" class="side-link-f d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-table-columns"></i> Dashboard
            </a>
            <a routerLink="/freelancer/buscar-trabajo" routerLinkActive="side-active-f" class="side-link-f d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-magnifying-glass"></i> Buscar trabajos
            </a>
            <a routerLink="/freelancer/mis-propuestas" routerLinkActive="side-active-f" class="side-link-f d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-paper-plane"></i> Mis propuestas
            </a>
            <a routerLink="/freelancer/contratos" routerLinkActive="side-active-f" class="side-link-f d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-file-contract"></i> Contratos
            </a>
            <hr style="border-color:#1c2d3c;margin:.5rem 0;">
            <a routerLink="/freelancer/mensajes" routerLinkActive="side-active-f" class="side-link-f d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-message"></i> Mensajes
            </a>
            <a routerLink="/freelancer/pagos" routerLinkActive="side-active-f" class="side-link-f d-flex align-items-center gap-2 p-2 rounded mb-1 text-decoration-none">
                <i class="fa-solid fa-credit-card"></i> Mis pagos
            </a>
            <hr style="border-color:#1c2d3c;margin:.5rem 0;">
            <a routerLink="/freelancer/perfil" routerLinkActive="side-active-f" class="side-link-f d-flex align-items-center gap-2 p-2 rounded text-decoration-none">
                <i class="fa-solid fa-user"></i> Mi perfil
            </a>
        </aside>

        <main class="flex-grow-1 p-4" style="background-color:#0d1420;color:#cde0f0;overflow-y:auto;">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>

<style>
    .side-link-f {
        color: #6e8fa8;
        font-size: .875rem;
        transition: .15s;
    }
    
    .side-link-f:hover {
        color: #cde0f0;
        background-color: #0f1e30 !important;
    }
    
    .side-active-f {
        color: #60b4e8 !important;
        background-color: #0f1e30 !important;
        font-weight: 600;
        border-left: 3px solid #60b4e8;
    }
</style>
